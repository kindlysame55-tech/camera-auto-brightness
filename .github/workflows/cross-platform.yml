name: Cross-platform test, build and release

on:
  push:
    branches: [main, 'codex/cross-platform-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      CAMAB_CONFIG: ${{ github.workspace }}/build/ci-config.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        if: runner.os != 'macOS'
        with:
          python-version: '3.12'
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk libgl1 libglib2.0-0 fonts-noto-cjk
      - name: macOS Python, Tk and brightness helper
        if: runner.os == 'macOS'
        run: |
          brew install python@3.12 python-tk@3.12 brightness
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
      - name: Install project
        shell: bash
        run: |
          python -m venv .venv
          if [[ "$RUNNER_OS" == Windows ]]; then py=.venv/Scripts/python; else py=.venv/bin/python; fi
          "$py" -m pip install --upgrade pip
          "$py" -m pip install -e '.[dev]'
      - name: Test and build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .venv/Scripts/python -m pytest -q --junitxml=build/tests.xml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./packaging/build_exe.ps1 -PythonExe .venv/Scripts/python.exe -SkipInstall
          ./packaging/build-launcher.ps1
          dist/Camab.exe tray --selftest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv/Scripts/python packaging/package_release.py
      - name: Test and build on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a .venv/bin/python -m pytest -q --junitxml=build/tests.xml
          xvfb-run -a .venv/bin/python -m PyInstaller packaging/camab.spec --noconfirm
          xvfb-run -a dist/Camab tray --selftest
          .venv/bin/python packaging/package_release.py
      - name: Test and build on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          .venv/bin/python -m pytest -q --junitxml=build/tests.xml
          .venv/bin/python -m PyInstaller packaging/camab.spec --noconfirm
          dist/Camab/Camab tray --selftest
          .venv/bin/python packaging/package_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.target }}
          path: build/tests.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  release:
    needs: native
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/codex/cross-platform-2.2'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Publish immutable version and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Version $tag already exists; refusing to overwrite a saved version."
            exit 1
          fi
          (cd release-assets && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "$tag · Windows / Linux / macOS" --notes-file packaging/release-notes-v2.2.0.md
